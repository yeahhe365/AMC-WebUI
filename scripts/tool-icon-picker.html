<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工具按钮图标挑选 - AMC-WebUI</title>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:#0a0a0f;color:#e5e7eb;min-height:100vh}
  .header{position:sticky;top:0;z-index:10;background:rgba(10,10,15,0.85);backdrop-filter:blur(12px);border-bottom:1px solid #27272a;padding:18px 24px}
  .header h1{font-size:18px;font-weight:700;letter-spacing:-0.01em}
  .header p{font-size:12px;color:#a1a1aa;margin-top:4px}
  .preview{margin:20px 24px;background:#18181b;border:1px solid #27272a;border-radius:16px;padding:20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
  .preview-label{font-size:12px;color:#71717a;letter-spacing:0.06em;text-transform:uppercase}
  .mock-input{margin-left:auto;display:flex;align-items:center;gap:10px;background:#09090b;border:1px solid #27272a;border-radius:9999px;padding:8px 10px 8px 16px;min-width:280px}
  .mock-input span{font-size:13px;color:#52525b}
  .mock-btn{width:36px;height:36px;border-radius:9999px;border:none;background:#27272a;color:#e4e4e7;display:flex;align-items:center;justify-content:center;cursor:default;transition:all .2s}
  .mock-btn.active{background:#3f3f46;color:#fafafa;transform:scale(1.06)}
  .mock-menu{margin:0 24px;background:#18181b;border:1px solid #27272a;border-radius:16px;padding:16px;display:flex;align-items:center;gap:12px}
  .mock-menu-item{display:flex;align-items:center;gap:8px;background:#27272a;border-radius:10px;padding:8px 12px;font-size:13px}
  .grid{padding:20px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding-bottom:40px}
  .card{background:#18181b;border:1px solid #27272a;border-radius:14px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;transition:.18s;position:relative}
  .card:hover{border-color:#3f3f46;transform:translateY(-1px)}
  .card.selected{border-color:#60a5fa;background:#1e293b;box-shadow:0 0 0 1px #60a5fa inset}
  .card.selected::after{content:'✓';position:absolute;top:8px;right:10px;font-size:12px;color:#60a5fa;font-weight:700}
  .icon-box{width:48px;height:48px;border-radius:12px;background:#09090b;border:1px solid #27272a;display:flex;align-items:center;justify-content:center}
  .card.selected .icon-box{background:#0f172a;border-color:#334155}
  .icon-box i, .icon-box svg{width:22px;height:22px}
  .name{font-size:11px;font-weight:600;letter-spacing:0.02em;text-align:center;line-height:1.3}
  .en{font-size:10px;color:#71717a}
  .desc{font-size:10px;color:#52525b;text-align:center;line-height:1.4;min-height:28px}
  .footer{position:sticky;bottom:0;background:rgba(10,10,15,0.92);backdrop-filter:blur(12px);border-top:1px solid #27272a;padding:14px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .code{flex:1;min-width:240px;background:#09090b;border:1px solid #27272a;border-radius:10px;padding:10px 12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:#e4e4e7;overflow:auto}
  .btn{padding:10px 18px;border-radius:10px;border:none;font-size:13px;font-weight:600;cursor:pointer}
  .btn-primary{background:#2563eb;color:#fff}
  .btn-primary:hover{background:#1d4ed8}
  .btn-ghost{background:#27272a;color:#e4e4e7}
  .badge{font-size:10px;padding:2px 6px;border-radius:999px;background:#27272a;color:#a1a1aa;border:1px solid #3f3f46}
</style>
</head>
<body>
<div class="header">
  <h1>🔧 工具按钮图标挑选 <span class="badge">AMC-WebUI · lucide-react</span></h1>
  <p>当前：输入框按钮为 <b>Paperclip 曲别针</b> · 点击下方卡片实时预览，复制代码后告诉我图标英文名即可替换</p>
</div>

<div class="preview">
  <div>
    <div class="preview-label">输入框按钮实时预览</div>
    <div style="font-size:11px;color:#52525b;margin-top:4px">点击卡片切换 ↓ 高亮为选中态</div>
  </div>
  <div class="mock-input">
    <span style="flex:1">输入消息…</span>
    <button class="mock-btn active" id="previewBtn" aria-label="工具按钮"><i data-lucide="paperclip"></i></button>
  </div>
  <div class="mock-menu">
    <span style="font-size:12px;color:#71717a">菜单预览（从设备上传已改为硬盘）：</span>
    <span class="mock-menu-item"><i data-lucide="hard-drive-upload" style="width:16px;height:16px"></i> 从设备上传</span>
  </div>
</div>

<div class="grid" id="grid"></div>

<div class="footer">
  <div class="code" id="code">import { Paperclip } from 'lucide-react';<br>&lt;Paperclip size={20} strokeWidth={2} /&gt;</div>
  <button class="btn btn-ghost" onclick="copyCode()">复制代码</button>
  <button class="btn btn-primary" onclick="confirmChoice()">就用这个 ✓</button>
  <span style="font-size:11px;color:#71717a" id="hint">已选中：Paperclip</span>
</div>

<script>
const ICONS = [
  { id:'wrench', label:'扳手', desc:'最经典的工具语义，通用', en:'Wrench' },
  { id:'hammer', label:'锤子', desc:'施工/工具箱感', en:'Hammer' },
  { id:'screwdriver', label:'螺丝刀', desc:'维修工具，细节感', en:'Screwdriver' },
  { id:'tool-case', label:'工具箱', desc:'收纳式工具，少见', en:'ToolCase' },
  { id:'briefcase', label:'工具包', desc:'公文包/工具箱近义', en:'Briefcase' },
  { id:'settings', label:'齿轮', desc:'设置/工具通用', en:'Settings' },
  { id:'cog', label:'齿轮2', desc:'与 Settings 同形变体', en:'Cog' },
  { id:'settings-2', label:'双齿轮', desc:'更复杂的工具感', en:'Settings2' },
  { id:'sliders-horizontal', label:'滑杆', desc:'调节/工具参数', en:'SlidersHorizontal' },
  { id:'pen-tool', label:'钢笔工具', desc:'设计类工具', en:'PenTool' },
  { id:'paintbrush', label:'画笔', desc:'创作工具', en:'Paintbrush' },
  { id:'pickaxe', label:'镐', desc:'开采/工具感强', en:'Pickaxe' },
  { id:'axe', label:'斧头', desc:'力量感工具', en:'Axe' },
  { id:'drill', label:'电钻', desc:'电动工具（若缺则回退 wrench）', en:'Drill' },
  { id:'ruler', label:'尺子', desc:'测量工具', en:'Ruler' },
  { id:'scissors', label:'剪刀', desc:'剪切工具', en:'Scissors' },
  { id:'construction', label:'施工锥', desc:'施工/工具场景', en:'Construction' },
  { id:'hard-hat', label:'安全帽', desc:'工程工具延伸', en:'HardHat' },
  { id:'lightbulb', label:'灯泡工具', desc:'灵感/工具提示', en:'Lightbulb' },
  { id:'puzzle', label:'拼图', desc:'扩展/工具插件感', en:'Puzzle' },
  { id:'blocks', label:'积木', desc:'组件/工具集合', en:'Blocks' },
  { id:'rocket', label:'火箭', desc:'效率工具感', en:'Rocket' },
  { id:'zap', label:'闪电', desc:'快捷工具', en:'Zap' },
  { id:'command', label:'命令', desc:'命令面板', en:'Command' },
];

let selected = 'wrench';
const grid = document.getElementById('grid');
const previewBtn = document.getElementById('previewBtn');
const codeEl = document.getElementById('code');
const hintEl = document.getElementById('hint');

function render(){
  grid.innerHTML='';
  ICONS.forEach(icon=>{
    const card=document.createElement('div');
    card.className='card'+(icon.id===selected?' selected':'');
    card.onclick=()=>choose(icon.id);
    card.innerHTML=`
      <div class="icon-box"><i data-lucide="${icon.id}"></i></div>
      <div class="name">${icon.label}</div>
      <div class="en">${icon.en} · ${icon.id}</div>
      <div class="desc">${icon.desc}</div>
    `;
    grid.appendChild(card);
  });
  lucide.createIcons();
  updatePreview();
}

function choose(id){
  selected=id;
  render();
}

function updatePreview(){
  const info = ICONS.find(i=>i.id===selected) || ICONS[0];
  previewBtn.innerHTML=`<i data-lucide="${selected}"></i>`;
  lucide.createIcons({el:previewBtn});
  const importName = toPascal(selected);
  codeEl.innerHTML = `import { ${importName} } from 'lucide-react';<br>&lt;${importName} size={20} strokeWidth={2} /&gt;`;
  hintEl.textContent = `已选中：${info.label} · ${info.en} (${selected}) → ${importName}`;
}

function toPascal(kebab){
  return kebab.split('-').map(s=>s.charAt(0).toUpperCase()+s.slice(1)).join('');
}

function copyCode(){
  const importName = toPascal(selected);
  const text = `import { ${importName} } from 'lucide-react';\n<${importName} size={20} strokeWidth={2} />`;
  navigator.clipboard.writeText(text).then(()=>{
    hintEl.textContent='✓ 已复制到剪贴板，请粘贴给助手';
    setTimeout(updatePreview,1500);
  });
}

function confirmChoice(){
  const importName = toPascal(selected);
  alert(`已选择：${selected} (${importName})\n\n请回到对话框告诉助手：\n“就用 ${selected} / ${importName}”\n\n助手会立即替换并重新部署到 Docker。`);
}

// 初始选中 wrench，最像工具
selected='wrench';
render();
lucide.createIcons();
</script>
</body>
</html>
