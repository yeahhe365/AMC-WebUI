services:
  api:
    image: ${API_IMAGE:-ghcr.io/yeahhe365/amc-webui-api:latest}
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    environment:
      PORT: 3001
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LIVE_GEMINI_API_KEY: ${LIVE_GEMINI_API_KEY:-}
      GEMINI_API_BASE: ${GEMINI_API_BASE:-https://generativelanguage.googleapis.com}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      ENABLE_MCP_STDIO: ${ENABLE_MCP_STDIO:-false}
      ENABLE_MCP_PRIVATE_HTTP: ${ENABLE_MCP_PRIVATE_HTTP:-false}
      ENABLE_THIRD_PARTY_PRIVATE_HTTP: ${ENABLE_THIRD_PARTY_PRIVATE_HTTP:-false}
      ENABLE_LIVE_WS_PROXY: ${ENABLE_LIVE_WS_PROXY:-true}
      LIVE_WS_IDLE_TIMEOUT_MS: ${LIVE_WS_IDLE_TIMEOUT_MS:-300000}
      SERVER_KEY_PRIORITY: ${SERVER_KEY_PRIORITY:-false}
      THIRD_PARTY_ROUTES: ${THIRD_PARTY_ROUTES:-}
      ACCESS_PASSWORD: ${ACCESS_PASSWORD:-}
      SERVER_ACCESS_TOKEN: ${SERVER_ACCESS_TOKEN:-}
      AMC_STREAM_JOB_TTL_MS: ${AMC_STREAM_JOB_TTL_MS:-600000}
      AMC_STREAM_JOB_HARD_MS: ${AMC_STREAM_JOB_HARD_MS:-3600000}
      AMC_STREAM_JOB_IDLE_MS: ${AMC_STREAM_JOB_IDLE_MS:-120000}
      AMC_STREAM_JOB_EVENT_BYTES: ${AMC_STREAM_JOB_EVENT_BYTES:-8388608}
      AMC_STREAM_JOB_RETAINED_BYTES: ${AMC_STREAM_JOB_RETAINED_BYTES:-8388608}
      AMC_STREAM_JOB_TOTAL_RETAINED_BYTES: ${AMC_STREAM_JOB_TOTAL_RETAINED_BYTES:-67108864}
      AMC_STREAM_JOB_TOTAL_PENDING_BYTES: ${AMC_STREAM_JOB_TOTAL_PENDING_BYTES:-16777216}
      AMC_STREAM_JOB_MAX_JOBS: ${AMC_STREAM_JOB_MAX_JOBS:-256}
      AMC_STREAM_JOB_MAX_ACTIVE: ${AMC_STREAM_JOB_MAX_ACTIVE:-32}
      AMC_STREAM_JOB_MAX_SUBSCRIBERS: ${AMC_STREAM_JOB_MAX_SUBSCRIBERS:-4}
      AMC_STREAM_JOB_TOTAL_SUBSCRIBERS: ${AMC_STREAM_JOB_TOTAL_SUBSCRIBERS:-128}
      AMC_STREAM_JOB_WRITE_BYTES: ${AMC_STREAM_JOB_WRITE_BYTES:-8454144}
      AMC_STREAM_JOB_TOTAL_WRITE_BYTES: ${AMC_STREAM_JOB_TOTAL_WRITE_BYTES:-67108864}
      AMC_STREAM_JOB_DRAIN_MS: ${AMC_STREAM_JOB_DRAIN_MS:-30000}
      AMC_STREAM_JOB_MAX_CHUNKS: ${AMC_STREAM_JOB_MAX_CHUNKS:-8192}
      AMC_STREAM_JOB_TOTAL_CHUNKS: ${AMC_STREAM_JOB_TOTAL_CHUNKS:-65536}
    expose:
      - '3001'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE:-ghcr.io/yeahhe365/amc-webui-web:latest}
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on:
      api:
        condition: service_healthy
    environment:
      RUNTIME_SERVER_MANAGED_API: ${RUNTIME_SERVER_MANAGED_API:-true}
      # Used for the WS handshake only; never published in runtime-config.js.
      RUNTIME_SERVER_ACCESS_PASSWORD: ${RUNTIME_SERVER_ACCESS_PASSWORD:-}
      RUNTIME_USE_CUSTOM_API_CONFIG: ${RUNTIME_USE_CUSTOM_API_CONFIG:-true}
      RUNTIME_USE_API_PROXY: ${RUNTIME_USE_API_PROXY:-true}
      RUNTIME_API_PROXY_URL: ${RUNTIME_API_PROXY_URL:-/api/gemini}
      RUNTIME_LIVE_API_BASE_URL: ${RUNTIME_LIVE_API_BASE_URL:-/api/live}
      RUNTIME_THIRD_PARTY_PROXY_URL: ${RUNTIME_THIRD_PARTY_PROXY_URL:-/api/openai}
      RUNTIME_PYODIDE_BASE_URL: ${RUNTIME_PYODIDE_BASE_URL:-}
    ports:
      - '${WEB_PORT:-8080}:80'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:80/healthz').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
