packages:
  - '.'
  - 'docs-site'
  - 'server'

# pnpm deploy derives a frozen, isolated runtime graph from the shared lockfile.
injectWorkspacePackages: true

allowBuilds:
  '@google/genai': true
  canvas: true
  core-js: true
  esbuild: true
  protobufjs: true
  sharp: true

minimumReleaseAgeExclude:
  - '@google/genai@2.29.1'

# 传递依赖安全下限（原 package.json 的 npm overrides 在 pnpm 下不生效，迁移至此）。
# 用 caret 范围而非精确版本：作为"不低于已修复版本"的下限，避免把已解析的更新版本降级。
# fast-uri 上限锁在 ^3：唯一消费方 ajv@8 声明 ^3，强制 4.x 会破坏其依赖声明。
overrides:
  argparse: ^2.0.1
  dompurify: 3.4.17
  brace-expansion@>=2.0.0 <2.1.7: ^2.1.7
  brace-expansion@>=4.0.0 <5.0.12: ^5.0.12
  devalue: ^5.9.3
  protobufjs: ^7.6.5
  ws: ^8.20.2
  uuid: ^14.0.0
  serialize-javascript: ^7.0.5
  postcss: ^8.5.25
  fast-uri: ^3.1.9
  http-cache-semantics: ^4.2.1
  ip-address: ^10.7.1
  katex: ^0.19.0
  postcss-selector-parser: ^7.1.6
  proxy-addr: ^2.0.8
  sharp: ^0.35.5
  smol-toml: ^1.8.1
  source-map-js: ^1.2.2
  undici@>=7.0.0 <7.30.1: ^7.30.2
  body-parser: ^2.4.0
  pdfjs-dist: 4.8.69
  qs: ^6.16.1
  '@xmldom/xmldom': ^0.8.15
  hono: ^4.13.11
  '@hono/node-server': ^2.1.3
